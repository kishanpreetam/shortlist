# Employers to scan. `boards` lists every public board we know of; the
# fetcher tries each and keeps the one with the most postings. A Workday board
# is tenant/wdN/site, from its address: northeastern.wd1.myworkdayjobs.com/careers.
#
# lca_2026: certified H-1B filings Jan-Jun 2026 where known (h1bdata.info,
#           2026-10-06 research). Replaced automatically once the DOL file
#           is imported with `python -m shortlist lca <file.xlsx>`.
# cap_exempt: universities, affiliated nonprofits, nonprofit research
#           institutes. No lottery. Always confirm with the employer.
# h1b: legal-name stem used to look up H-1B filings (defaults to the name).
# tags: boston | api (developer platform) | ai_product (AI product company) |
#       data (data-platform company). Link tags to your own projects in profile.yaml `proof`.

