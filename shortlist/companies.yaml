# cap_exempt: universities, affiliated nonprofits, nonprofit research
#           institutes. No lottery. Always confirm with the employer.
# h1b: legal-name stem used to look up H-1B filings (defaults to the name).
# tags: boston | api (developer platform) | ai_product (AI product company) |
#       data (data-platform company). Link tags to your own projects in profile.yaml `proof`.

