# Copy to profile.yaml and edit. profile.yaml is gitignored, so your details stay local.

name: Your Name
home_area: "14460"        # OFLC area code where you'd work remotely (14460 = Boston-Cambridge-Newton)
home_label: Boston        # shown in the target list for local openings
years_experience: 1.5     # full-time-equivalent professional experience
degree: bachelors         # optional: bachelors, masters or phd. A master's or PhD meets "or 5+ years with an advanced degree" asks
lottery_seasons: 2        # H-1B lotteries you can enter before your work authorization ends

# Role families to scan (keys from shortlist/roles.py). Remove ones you don't want.
roles: [data_engineer, ai_engineer, forward_deployed, data_scientist, data_analyst, analytics_engineer,
        bi_engineer, research_engineer, ml_engineer, consulting, software_engineer, business_analyst]

# Skill levels: 1.0 = strong (used in real work), 0.7 = solid, 0.5 = working knowledge.
# Keys are listed in shortlist/classify.py (SKILLS). List only what you can defend in an interview.
skills:
  python: 1.0
  sql: 1.0
  pandas: 0.8
  aws: 0.7
  etl: 0.7
  tableau: 0.7
  statistics: 0.7
  scikit_learn: 0.6
  git: 0.8

# How well you fit each role family overall (default 0.6). Raise the ones your experience matches.
role_overrides: {}
#  data_engineer: {fit: 0.85}

# For the target list: your school's LinkedIn slug enables alumni-search links.
school: Your University
school_linkedin: your-university        # linkedin.com/school/<this>/people
data_angle: ""                          # e.g. "two years of production ETL at <employer>"

# Projects that prove you can do the work at employers with matching tags
# (tags are set per company in shortlist/companies.yaml).
proof: {}
#  api:
#    project: My API Project
#    roles: [ai_engineer, software_engineer]
#    boost: 0.15
#    angle: "built something on their API"

# People you know, by company. warm: true = someone who will reply; alumni: count of alumni there.
contacts: {}
#  HubSpot: {alumni: 12, warm: false}

exclude_companies: []

# ---- Daily apply queue (python -m shortlist today) ----
# Optional. Paths to the resume version you send for each kind of role, and one sentence
# of proof per version for the short message to a person at the company.
# Versions: ai-engineer, data-engineer, data-scientist, data-analyst (see RESUME_FOR in apply.py;
# override per role family with `resume_for: {software_engineer: data-engineer}`).
resumes: {}
#  data-engineer: /path/to/Your-Name-Data-Engineer.pdf
pitch: {}
#  data-engineer: "I built the Python and SQL pipelines behind <something real>."
# Optional: tailor a resume to each job on the page, from your facts file (see shortlist/resume.py).
# resume_facts: /path/to/facts.json
# tailored_dir: ~/Documents/Resumes
# With Claude Code installed and signed in (`claude auth login`), Claude rewrites your points for each job,
# and only rewrites that keep your facts are used.
# rewrite_points: true          # false keeps your own wording
# rewrite_warmup: 5             # how many of the next jobs to rewrite in the background (0 waits for a Tailor click)
# rewrite_repair: true          # rewrites the fact check drops go back to Claude once with its reasons; false skips it
# claude_path: /path/to/claude  # if it isn't on your PATH
# learn_keywords: true          # learn the tools postings name beyond the built-in list (data/lexicon.json); false turns it off
# Words that never go on any resume it builds: headings drop them, and lines that use one stay off.
# resume_never_words: [contract]
